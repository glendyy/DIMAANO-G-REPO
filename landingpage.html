<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Series</title>

    <style>

        /* =========================
           PAGE
        ========================= */

        body {
            margin: 0;
            padding: 0;

            background-color: white;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 770px;
            height: 560px;

            border: 2px solid black;

            display: grid;

            /*
                Left = 200px
                Right = remaining space
            */
            grid-template-columns: 200px 1fr;

            box-sizing: border-box;

            overflow: hidden;
        }


        /* =========================
           LEFT ANIME
        ========================= */

        .left {
            border-right: 2px solid black;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        .left a {
            display: block;

            width: 100%;
            height: 100%;
        }

        .left img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* =========================
           RIGHT SIDE
        ========================= */

        .right {
            width: 100%;
            height: 100%;

            display: grid;

            /*
                4 columns
            */
            grid-template-columns: repeat(4, 1fr);

            /*
                Header + 3 rows
            */
            grid-template-rows: 85px repeat(3, 1fr);

            box-sizing: border-box;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            grid-column: 1 / 5;

            background-color: #141a38;

            color: white;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 30px;

            font-weight: bold;

            border-bottom: 1px solid black;
        }


        /* =========================
           ANIME BOX
        ========================= */

        .anime {
            border: 1px solid black;

            box-sizing: border-box;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            background-color: white;
        }


        /* =========================
           ANIME IMAGE
        ========================= */

        .anime img {
            width: 100%;

            height: calc(100% - 35px);

            object-fit: cover;

            display: block;
        }


        /* =========================
           ANIME NAME
        ========================= */

        .anime a {
            height: 35px;

            display: flex;

            justify-content: center;
            align-items: center;

            color: blue;

            text-decoration: none;

            font-size: 15px;

            background-color: white;
        }

        .anime a:hover {
            text-decoration: underline;
        }

    </style>
</head>


<body>


    <!-- =================================
         MAIN CONTAINER
    ================================== -->
